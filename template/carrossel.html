<!doctype html>
<meta charset="utf-8">
<title>Carrossel · Matheus Ramos</title>
<script id="dados" type="application/json">{"serie":"","numero":"","pergunta":"","telas":[],"proximo":""}</script>
<style>
  @font-face{font-family:Literata;src:url(assets/fonts/literata-latin-400-normal.woff2)format("woff2");font-weight:400;font-display:block}
  @font-face{font-family:Literata;src:url(assets/fonts/literata-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
  @font-face{font-family:Literata;src:url(assets/fonts/literata-latin-700-normal.woff2)format("woff2");font-weight:700;font-display:block}
  @font-face{font-family:"IBM Plex Mono";src:url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2)format("woff2");font-weight:500;font-display:block}
  @font-face{font-family:"IBM Plex Mono";src:url(assets/fonts/ibm-plex-mono-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}
  @font-face{font-family:"Source Sans 3";src:url(assets/fonts/source-sans-3-latin-600-normal.woff2)format("woff2");font-weight:600;font-display:block}

  :root{
    --tinta:#1B1A17; --papel:#F3EFE6; --verde:#33503F; --neutro:#8A8578;
    --W:1080px; --H:1350px; --pad:96px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#4a4a48;font-family:Literata,Georgia,serif;-webkit-font-smoothing:antialiased}

  .tela{
    width:var(--W); height:var(--H); background:var(--papel); color:var(--tinta);
    padding:var(--pad); position:relative; overflow:hidden;
    display:flex; flex-direction:column; margin:0 auto 28px;
  }

  /* numero inline, regra 2 da marca: todo numero em mono */
  .n{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--verde);font-size:.92em;letter-spacing:-.01em}

  /* ---------- CAPA ---------- */
  .capa{justify-content:space-between;align-items:center;text-align:center}
  .eyebrow{
    font-family:"Source Sans 3",system-ui,sans-serif;font-weight:600;font-size:25px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--neutro);
  }
  .disco{position:relative;width:640px;height:640px;flex:none}
  .disco svg{display:block;width:100%;height:100%}
  .disco .valor{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--papel);
    letter-spacing:-.045em;line-height:1;padding-bottom:.04em;
  }
  .pergunta{font-size:52px;line-height:1.32;font-weight:400;max-width:840px}
  .capa .marca{height:52px;opacity:.9}

  /* ---------- TELAS INTERNAS ---------- */
  .topo{display:flex;align-items:center;gap:26px;flex:none}
  .contador{
    font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:27px;
    color:var(--neutro);letter-spacing:.02em;flex:none;
  }
  .barra{height:3px;background:#DDD8CB;flex:1;position:relative}
  .barra i{position:absolute;inset:0 auto 0 0;background:var(--verde)}

  .corpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px 0}
  .titulo{font-size:70px;font-weight:700;line-height:1.14;letter-spacing:-.02em;margin-bottom:44px}
  .titulo .n{font-size:.94em;font-weight:600}
  .texto{font-size:40px;line-height:1.62;font-weight:400;max-width:880px}
  .texto p+p{margin-top:30px}

  .rodape{display:flex;align-items:flex-end;justify-content:space-between;flex:none;height:64px}
  .rodape .mira{width:56px;height:56px;opacity:.55}

  /* ---------- FECHO ---------- */
  .fecho .corpo{justify-content:center;padding-bottom:32px}
  .fecho .titulo{font-size:44px;font-weight:600;color:var(--neutro);letter-spacing:0;margin-bottom:36px}
  .fecho .texto{font-size:58px;line-height:1.34;font-weight:600;letter-spacing:-.015em}
  .fecho .rodape{height:auto;align-items:center}
  .selo{width:132px;height:132px}
  .proximo{
    text-align:right;font-family:"Source Sans 3",system-ui,sans-serif;font-weight:600;
    font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--neutro);line-height:1.6;
  }
  .proximo b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;
    font-size:44px;letter-spacing:-.02em;color:var(--verde);text-transform:none;margin-top:6px}
</style>
<body>
<script>
(function(){
  const d = JSON.parse(document.getElementById('dados').textContent);
  const total = d.telas.length + 2;               // capa + telas + fecho
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // `65%` vira <span class=n>65%</span>, respeitando a regra de numero em mono
  const mono = s => esc(s).replace(/`([^`]+)`/g, '<span class="n">$1</span>');

  // disco: cornicione 0.16R, campo 0.84R (geometria do manual)
  const disco = `<svg viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="140" fill="none" stroke="#1B1A17" stroke-width="4"/>
      <circle cx="150" cy="150" r="118" fill="#33503F"/></svg>`;

  const mira = `<svg viewBox="0 0 100 100" class="mira" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#1B1A17" stroke-width="4"/>
      <circle cx="50" cy="50" r="14" fill="none" stroke="#1B1A17" stroke-width="4"/>
      <path d="M50 4v18M50 78v18M4 50h18M78 50h18" stroke="#1B1A17" stroke-width="4"/></svg>`;

  // o numero da capa encolhe conforme cresce, pra nunca vazar do campo
  const dim = {1:300,2:250,3:196,4:160,5:134,6:116}[String(d.numero).length] || 104;

  const topo = i => `<div class="topo">
      <span class="contador">${i}/${total}</span>
      <span class="barra"><i style="width:${(i/total*100).toFixed(1)}%"></i></span></div>`;

  const html = [
    `<section class="tela capa">
       <span class="eyebrow">${esc(d.serie)}</span>
       <div class="disco">${disco}<span class="valor" style="font-size:${dim}px">${esc(d.numero)}</span></div>
       <p class="pergunta">${mono(d.pergunta)}</p>
       <img class="marca" src="assets/logo/wordmark-tinta.png" alt="Matheus Ramos">
     </section>`,
    ...d.telas.map((t,k) => `<section class="tela">
       ${topo(k+2)}
       <div class="corpo">
         <h2 class="titulo">${mono(t.titulo)}</h2>
         <div class="texto">${t.texto.split('\n\n').map(p=>`<p>${mono(p)}</p>`).join('')}</div>
       </div>
       <div class="rodape"><span></span>${mira}</div>
     </section>`),
    `<section class="tela fecho">
       ${topo(total)}
       <div class="corpo">
         <h2 class="titulo">Em uma linha</h2>
         <div class="texto">${mono(d.sintese)}</div>
       </div>
       <div class="rodape">
         <img class="selo" src="assets/logo/selo.png" alt="MR">
         ${d.proximo ? `<span class="proximo">Próximo número<b>${esc(d.proximo)}</b></span>` : '<span></span>'}
       </div>
     </section>`
  ].join('');

  document.body.insertAdjacentHTML('beforeend', html);
})();
</script>
